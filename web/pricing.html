<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free - ZetaReps</title>
    <meta name="description" content="ZetaReps pricing plans - Free with 100 pushups or Premium for unlimited tracking">
    <meta http-equiv="refresh" content="0; url=index.html#pricing">
    <link rel="canonical" href="https://rabah-khalek.github.io/zetareps/#pricing">

    <!-- Umami Analytics - Privacy-friendly website analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="04820e2b-beea-40ed-9e1e-30cece0ab0c7"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
            background: #0a0a0a;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .redirect-message {
            max-width: 400px;
            padding: 32px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(238, 34, 12, 0.3);
            border-top: 2px solid #EE220C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        a {
            color: #EE220C;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="redirect-message">
        <div class="spinner"></div>
        <h1>Redirecting to Pricing...</h1>
        <p>You're being redirected to our pricing section.</p>
        <p>If you're not redirected automatically, <a href="index.html#pricing">click here</a>.</p>
    </div>

    <script>
        // Fallback redirect in case meta refresh doesn't work
        setTimeout(function () {
            window.location.href = 'index.html#pricing';
        }, 100);
    </script>
</body>

</html>
